name: "Placard"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  placard:
    name: MCP surface gate
    runs-on: ubuntu-latest
    # Dedicated job: scanning launches this repo's server as the runner user.
    # Keep it free of deploy credentials and secrets.
    permissions:
      contents: read
      security-events: write   # SARIF upload to code scanning
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - name: Placard
      # Pinned by commit SHA (mcp-placard v0.7.0 main), never by tag.
      uses: Lanier-Developments/mcp-placard@6dc98e4f5e7e17b7eda4cd6fefee404e5c4cc283
      env:
        MCP_FS_CONFIG_PATH: ${{ github.workspace }}/ci-config.json
      with:
        fail-on: escalation,prompt,injection,incomplete
